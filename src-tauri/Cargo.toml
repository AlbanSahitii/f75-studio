[package]
name = "f75-studio"
version = "0.1.0"
description = "Open-source configurator for the AULA F75 keyboard"
authors = ["F75 Studio contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "f75_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared mode: never seize the keyboard away from macOS while the app is open.
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s" # smallest binary; this app is I/O-bound, never compute-bound
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = "0.3.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventManager", "NSAppleEventDescriptor"] }
